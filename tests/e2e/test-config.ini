# Full-stack hybrid E2E settings (tests/e2e/test_full_stack_cluster_deploy.py).
# Precedence per key: environment override FORGE_E2E_<KEY> (e.g. FORGE_E2E_MODE) > this file > built-in default.
# Blank values fall through to the environment / default. No passwords belong in this file.

[lab]
lab_name = e2e-lab
pve_host = 10.0.0.5
storage_pool = local-lvm
network_bridge = vmbr0

[cluster]
cluster_name = e2e-nkp-01
control_plane_nodes = 3
worker_nodes = 4
# Optional safety guards (aborts the run if already allocated in GET /api/v1/ipam); blank = auto-allocate.
control_plane_vip =
metallb_range =

[execution]
# ui-only (alias: dry-run): wizard through Stage 4 against the mock backend, never Launch.
# live-proxmox: Launch for real, stream logs, then audit Proxmox / kubectl / helm / NKP dashboard.
mode = ui-only
verify_qm_status = true
verify_kubectl = true
verify_helm = true
verify_nkp_dashboard = true

# --- live-proxmox only -------------------------------------------------------
# Running Forge Central API to drive (the Vite dev server proxies to it). Required in live-proxmox mode.
backend_url =
# SSH user for `qm status <vmid>` on pve_host (key-based, BatchMode).
pve_ssh_user = root
# kubeconfig of the new cluster; blank = newest ~/nkp/*/<cluster_name>.conf
kubeconfig =
# forge CLI used for `get nkp-dashboard`; blank = $FORGE_BIN or ../nkp-forge/forge
forge_bin =
# Generated <cluster>-input.ini; blank = config_path returned by the wizard
forge_conf =
# Comma-separated substrings that must appear among deployed helm releases.
helm_releases = csi,metallb,kommander
# Max seconds to wait for the pipeline to reach COMPLETED.
launch_timeout_seconds = 5400
