# Forge Central — single-service Compose deployment
services:
  forge-central:
    build: .
    image: forge-central:latest
    container_name: forge-central
    ports:
      - "${PORT:-8000}:8000"
    environment:
      FORGE_MOCK_MODE: "${FORGE_MOCK_MODE:-false}"
      FORGE_HOME: "${FORGE_HOME:-/forge-state}"
      FORGE_STATE_DIR: "${FORGE_STATE_DIR:-/forge-state}"
      FORGE_CENTRAL_DATA_DIR: "${FORGE_CENTRAL_DATA_DIR:-/forge-state}"
      FORGE_DATA_DIR: "${FORGE_DATA_DIR:-/forge-data}"
      FORGE_CACRT_DIR: "${FORGE_CACRT_DIR:-/cacrt}"
      FORGE_LOG_DIR: "${FORGE_LOG_DIR:-/var/log/forge-central}"
      FORGE_BIN: "${FORGE_BIN:-/nkp-forge/forge}"
    volumes:
      - ~/forge-state:/forge-state
      - ~/forge-data:/forge-data
      - ~/cacrt:/cacrt
      - ~/nkp-forge:/nkp-forge:ro
      - ~/.ssh:/home/forgecentral/.ssh:ro
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          cpus: "0.50"
          memory: 256M
